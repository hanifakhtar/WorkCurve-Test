<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkCurve Test</title>
<style>
/* ============================================================
   DASAR: padanan gaya Bootstrap 3 yang dipakai fluidPage() Shiny
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: rgba(0,0,0,0); }
body { margin: 0; font-size: 14px; line-height: 1.42857143; }
h2, h3 { font-family: inherit; font-weight: 500; line-height: 1.1; color: inherit; margin-bottom: 10px; }
h2 { margin-top: 20px; font-size: 30px; }
h3 { margin-top: 20px; font-size: 24px; }
p { margin: 0 0 10px; }
ul { margin-top: 0; margin-bottom: 10px; padding-left: 40px; }
b, strong { font-weight: 700; }
pre {
  font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
  padding: 9.5px; margin: 0 0 10px; line-height: 1.42857143;
  word-break: break-all; word-wrap: break-word; color: #333;
  background-color: #f5f5f5; border: 1px solid #ccc; border-radius: 4px;
}
label { display: inline-block; max-width: 100%; margin-bottom: 5px; font-weight: 700; }
button, input, select { font: inherit; color: inherit; margin: 0; }
summary { cursor: pointer; }

.container-fluid { padding-left: 15px; padding-right: 15px; }
.lead { margin-bottom: 20px; font-weight: 300; }
.form-group { margin-bottom: 15px; }
.shiny-input-container { width: 300px; max-width: 100%; }

.form-control {
  display: block; width: 100%; height: 34px; padding: 6px 12px;
  font-size: 14px; line-height: 1.42857143; color: #555;
  background-color: #fff; border: 1px solid #ccc; border-radius: 4px;
  transition: border-color .15s ease-in-out;
}
.form-control:focus { outline: 0; }

.row-2 { display: grid; grid-template-columns: 1fr; column-gap: 30px; }
@media (min-width: 768px) { .row-2 { grid-template-columns: 1fr 1fr; } }

.btn {
  display: inline-block; margin-bottom: 0; font-weight: 400; text-align: center;
  white-space: nowrap; vertical-align: middle; touch-action: manipulation;
  cursor: pointer; border: 1px solid transparent; padding: 6px 12px;
  font-size: 14px; line-height: 1.42857143; border-radius: 4px;
  -webkit-user-select: none; user-select: none; text-decoration: none;
}
.btn-default { color: #333; background-color: #fff; border-color: #ccc; }
.btn-default:hover, .btn-default:focus { color: #333; background-color: #e6e6e6; border-color: #adadad; }
.btn-primary { color: #fff; }
.btn-primary:hover, .btn-primary:focus { color: #fff; }
.btn .btn-icon { width: 13px; height: 13px; vertical-align: -1px; margin-right: 4px; }

.checkbox, .radio { position: relative; display: block; margin-top: 10px; margin-bottom: 10px; }
.checkbox label, .radio label { min-height: 20px; padding-left: 20px; margin-bottom: 0; font-weight: 400; cursor: pointer; }
.checkbox input[type="checkbox"], .radio input[type="radio"] { position: absolute; margin: 4px 0 0 -20px; }

/* Notifikasi (padanan showNotification() Shiny) */
#notification-panel {
  position: fixed; bottom: 0; right: 0; padding: 2px;
  width: 250px; max-width: 100%; z-index: 99999;
}
.shiny-notification {
  background-color: #e8e8e8; color: #333; border: 1px solid #ccc;
  border-radius: 3px; opacity: 0.85; padding: 10px 8px 10px 10px; margin: 2px;
}
.shiny-notification-warning { color: #8a6d3b; background-color: #fcf8e3; border: 1px solid #faebcc; }
.shiny-notification-error { color: #a94442; background-color: #f2dede; border: 1px solid #ebccd1; }
.shiny-notification-close {
  float: right; font-weight: bold; font-size: 18px; bottom: 9px;
  position: relative; padding-left: 4px; color: #444; cursor: pointer; line-height: 1;
}

/* ============================================================
   GAYA APLIKASI (disalin dari app.R)
   ============================================================ */
:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --text: #172033;
  --muted: #667085;
  --line: #e6eaf0;
  --primary: #3b5ccc;
  --primary-dark: #2f4cae;
  --success: #157f5b;
  --danger: #b42318;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
}

.app-shell { max-width: 880px; margin: 0 auto; padding: 28px 16px 48px 16px; }
.brand { margin-bottom: 22px; }
.brand-title { font-size: 26px; font-weight: 750; letter-spacing: -0.4px; margin: 0; }
.brand-subtitle { color: var(--muted); margin-top: 4px; font-size: 14px; }

.panel-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 26px;
  box-shadow: 0 8px 28px rgba(24, 39, 75, 0.05);
  margin-bottom: 18px;
}
.panel-card h2 { margin-top: 0; font-size: 24px; }
.panel-card h3 { font-size: 18px; margin-top: 24px; }

.lead { color: var(--muted); line-height: 1.65; font-size: 15px; }

.form-control {
  border-radius: 10px !important;
  border-color: #d8dee8 !important;
  box-shadow: none !important;
}
.form-control:focus { border-color: var(--primary) !important; }

.btn-primary {
  background: var(--primary);
  border-color: var(--primary);
  border-radius: 10px;
  padding: 10px 18px;
  font-weight: 650;
}
.btn-primary:hover,
.btn-primary:focus { background: var(--primary-dark); border-color: var(--primary-dark); }
.btn-default { border-radius: 10px; }

.instruction-box {
  background: #f8f9fc;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  margin: 18px 0;
}

.example-box {
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  padding: 18px;
  background: #f8f9fc;
  border-radius: 12px;
  margin: 18px 0;
}

.progress-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.progress-stat {
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  background: #fafbfc; text-align: center;
}
.progress-label { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
.progress-value { font-size: 18px; font-weight: 750; font-variant-numeric: tabular-nums; }
.progress-track {
  width: 100%; height: 7px; background: #e8ecf4; border-radius: 999px;
  overflow: hidden; margin-bottom: 28px;
}
.progress-fill { height: 100%; background: var(--primary); border-radius: 999px; }

.test-stage { text-align: center; padding: 12px 0 8px 0; }
.stimulus-wrap {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 170px; padding: 24px 44px; border: 2px solid var(--line); border-radius: 20px;
  background: #fff; margin: 10px auto 20px auto;
}
.stimulus-number { font-size: 66px; line-height: 0.98; font-weight: 760; font-variant-numeric: tabular-nums; }
.stimulus-number.bottom { border-bottom: 4px solid var(--text); padding-bottom: 8px; margin-top: 7px; }

.keypad { max-width: 390px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
.keypad-btn {
  background: #fff;
  border: 1px solid #d8dee8;
  border-radius: 12px;
  padding: 14px 0;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  color: var(--text);
  transition: all 0.08s ease;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
@media (hover: hover) {
  .keypad-btn:hover { border-color: var(--primary); color: var(--primary); }
}
.keypad-btn:active { transform: scale(0.97); background: #f0f3ff; }
.keyboard-hint { color: var(--muted); font-size: 13px; margin-top: 13px; }

.metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0; }
.basic-metric-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 18px 0 28px 0; }
.basic-metric-card { border: 1px solid var(--line); background: #ffffff; border-radius: 14px; padding: 15px 14px; min-width: 0; }
.basic-metric-card .metric-value { font-size: 23px; }

.profile-section { margin-top: 8px; padding: 22px; border: 1px solid #dfe4ff; background: #f7f8ff; border-radius: 18px; }
.profile-section-title { font-size: 18px; font-weight: 750; margin-bottom: 4px; }
.profile-section-note { color: var(--muted); font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
.profile-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.profile-card {
  background: #ffffff; border: 1px solid #d9def7; border-radius: 16px;
  padding: 18px 16px; position: relative; overflow: hidden;
}
.profile-card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--primary); }
.profile-card .metric-label { font-size: 13px; font-weight: 650; color: #59617a; }
.profile-card .metric-value { font-size: 29px; margin-top: 3px; }
.profile-card .small-note { margin-top: 6px; }

.metric-card { border: 1px solid var(--line); background: #fafbfc; border-radius: 14px; padding: 16px; }
.metric-label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.metric-value { font-size: 25px; font-weight: 760; }

.save-ok { background: #ecfdf3; color: #087443; border: 1px solid #abefc6; padding: 12px 14px; border-radius: 12px; margin: 14px 0; }
.save-error { background: #fef3f2; color: #b42318; border: 1px solid #fecdca; padding: 12px 14px; border-radius: 12px; margin: 14px 0; }

.small-note { color: var(--muted); font-size: 13px; line-height: 1.55; }

/* Kurva performa (padanan renderPlot) */
.plot-wrap { position: relative; width: 100%; height: 330px; margin-bottom: 10px; }
.plot-wrap svg { display: block; }
.plot-hit { cursor: crosshair; touch-action: pan-y; }
.plot-tip {
  position: absolute; pointer-events: none; display: none;
  background: #fff; color: var(--text); border: 1px solid var(--line); border-radius: 10px;
  padding: 7px 10px; font-size: 12px; line-height: 1.5; white-space: nowrap;
  box-shadow: 0 6px 18px rgba(24, 39, 75, 0.12);
}
.plot-tip strong { display: block; font-size: 12px; }
.plot-tip .tip-row { color: var(--muted); }
.plot-tip .tip-row b { color: var(--text); font-weight: 650; }

.table-view { margin: 4px 0 14px 0; }
.table-view summary { color: var(--muted); font-size: 13px; }
.table-scroll { overflow-x: auto; margin-top: 10px; }
.interval-table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.interval-table th, .interval-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.interval-table th { color: var(--muted); font-weight: 600; }
.interval-table th:first-child, .interval-table td:first-child { text-align: left; }

@media (max-width: 700px) {
  .panel-card { padding: 20px 16px; border-radius: 14px; }
  .progress-grid,
  .metric-grid,
  .profile-grid { grid-template-columns: repeat(2, 1fr); }
  .basic-metric-grid { grid-template-columns: repeat(2, 1fr); }
  .stimulus-number { font-size: 58px; }
  .stimulus-wrap { padding: 20px 38px; }
}

@media (max-width: 430px) {
  .basic-metric-grid,
  .profile-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container-fluid">
  <div class="app-shell">
    <div class="brand">
      <div class="brand-title" id="brand-title">WorkCurve Test</div>
    </div>
    <div id="page"></div>
  </div>
</div>
<div id="notification-panel" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ============================================================
  // WORKCURVE TEST (versi HTML)
  // 2 interval latihan x 20 detik
  // 30 interval tes x 20 detik = 10 menit
  // ============================================================

  // -----------------------------
  // KONFIGURASI
  // -----------------------------
  var CONFIG = {
    // Nama yang tampil di judul halaman dan teks persetujuan.
    APP_NAME: 'WorkCurve Test',

    INTERVAL_SECONDS: 20,
    PRACTICE_INTERVALS: 2,
    TEST_INTERVALS: 30,

    // URL Web App Google Apps Script (berakhiran /exec). Lihat Code.gs.
    // Kosongkan untuk mencoba tampilan tanpa menyimpan data.
    SAVE_ENDPOINT: 'https://script.google.com/macros/s/AKfycbzJ7X5rt-uKrtm1144Ifm1E-Lgh8cW30xZMa5yL8KuS1aeUt_tzLEzeCaeoqnqW2TYj/exec',

    // Ditulis ke kolom app_version. Naikkan bila aturan tes diubah,
    // agar data dari versi berbeda mudah dipisahkan.
    APP_VERSION: 'html-1.0'
  };

  var INTERVAL_SECONDS = CONFIG.INTERVAL_SECONDS;
  var PRACTICE_INTERVALS = CONFIG.PRACTICE_INTERVALS;
  var TEST_INTERVALS = CONFIG.TEST_INTERVALS;
  var PENDING_PREFIX = 'workcurve_pending_';

  var PROVINCES = [
    'Aceh', 'Sumatera Utara', 'Sumatera Barat', 'Riau', 'Kepulauan Riau', 'Jambi',
    'Sumatera Selatan', 'Kepulauan Bangka Belitung', 'Bengkulu', 'Lampung',
    'DKI Jakarta', 'Jawa Barat', 'Banten', 'Jawa Tengah', 'DI Yogyakarta', 'Jawa Timur',
    'Bali', 'Nusa Tenggara Barat', 'Nusa Tenggara Timur',
    'Kalimantan Barat', 'Kalimantan Tengah', 'Kalimantan Selatan', 'Kalimantan Timur', 'Kalimantan Utara',
    'Sulawesi Utara', 'Gorontalo', 'Sulawesi Tengah', 'Sulawesi Barat', 'Sulawesi Selatan', 'Sulawesi Tenggara',
    'Maluku', 'Maluku Utara',
    'Papua', 'Papua Barat', 'Papua Barat Daya', 'Papua Tengah', 'Papua Pegunungan', 'Papua Selatan'
  ];

  // -----------------------------
  // HELPERS
  // -----------------------------
  var NA = null;

  function isNA(x) {
    return x === null || x === undefined || (typeof x === 'number' && isNaN(x));
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function p2(n) { return (n < 10 ? '0' : '') + n; }

  // Asia/Jakarta = UTC+7 sepanjang tahun (tanpa DST).
  function jakartaNow() { return new Date(Date.now() + 7 * 3600 * 1000); }

  function jakartaTime() {
    var d = jakartaNow();
    return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()) +
      ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds());
  }

  // Bilangan bulat acak seragam pada [min, max].
  function randInt(min, max) {
    var range = max - min + 1;
    var c = window.crypto || window.msCrypto;
    if (c && c.getRandomValues) {
      var buf = new Uint32Array(1);
      var limit = Math.floor(4294967296 / range) * range;
      var x;
      do { c.getRandomValues(buf); x = buf[0]; } while (x >= limit);
      return min + (x % range);
    }
    return min + Math.floor(Math.random() * range);
  }

  function newParticipantId() {
    var d = jakartaNow();
    var stamp = '' + d.getUTCFullYear() + p2(d.getUTCMonth() + 1) + p2(d.getUTCDate()) +
      p2(d.getUTCHours()) + p2(d.getUTCMinutes()) + p2(d.getUTCSeconds());
    return stamp + '-' + ('000000' + randInt(1, 999999)).slice(-6);
  }

  // Pembulatan seperti round() di R 4.x: memakai nilai desimal eksak dari
  // bilangan double, dan "ke angka genap" bila tepat di tengah (0.125 -> 0.12).
  function roundR(x, digits) {
    if (isNA(x)) return NA;
    if (!isFinite(x) || x === 0) return x;
    var d = digits || 0;
    var ax = Math.abs(x);
    if (ax >= 1e15) return x;
    var r;
    try {
      var exact = ax.toFixed(100);
      var dot = exact.indexOf('.');
      var frac = exact.slice(dot + 1);
      var rest = frac.slice(d);
      if (rest.charAt(0) === '5' && /^0*$/.test(rest.slice(1))) {
        var lastDigit = d > 0 ? Number(frac.charAt(d - 1)) : Number(exact.charAt(dot - 1));
        var truncated = Number(exact.slice(0, dot) + (d > 0 ? '.' + frac.slice(0, d) : ''));
        r = (lastDigit % 2 === 0) ? truncated : Number((truncated + Math.pow(10, -d)).toFixed(d));
      } else {
        r = Number(ax.toFixed(d));
      }
    } catch (e) {
      r = Number(ax.toFixed(d));
    }
    return x < 0 ? -r : r;
  }

  // Padanan sprintf("%+.3f", x)
  function fmtSigned(x, d) {
    if (isNA(x)) return '–';
    var sign = (x < 0 || Object.is(x, -0)) ? '-' : '+';
    return sign + Math.abs(roundR(x, d)).toFixed(d);
  }

  // Padanan as.character(round(x, d)) di R
  function fmtNum(x, d) {
    if (isNA(x)) return '–';
    var v = d === undefined ? x : roundR(x, d);
    return String(v === 0 ? 0 : v);
  }

  function formatDuration(totalSeconds) {
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    var parts = [];
    if (m > 0) parts.push(m + ' menit');
    if (s > 0 || m === 0) parts.push(s + ' detik');
    return parts.join(' ');
  }

  function sum(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; }
  function mean(a) { return a.length ? sum(a) / a.length : NA; }

  function sd(a) {
    var n = a.length;
    if (n < 2) return NA;
    var m = sum(a) / n, ss = 0;
    for (var i = 0; i < n; i++) ss += (a[i] - m) * (a[i] - m);
    return Math.sqrt(ss / (n - 1));
  }

  function median(a) {
    if (!a.length) return NA;
    var s = a.slice().sort(function (x, y) { return x - y; });
    var h = Math.floor(s.length / 2);
    return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
  }

  // Padanan lm(y ~ x) untuk satu prediktor.
  function linearFit(x, y) {
    var mx = mean(x), my = mean(y), sxy = 0, sxx = 0;
    for (var i = 0; i < x.length; i++) {
      sxy += (x[i] - mx) * (y[i] - my);
      sxx += (x[i] - mx) * (x[i] - mx);
    }
    if (!(sxx > 0)) return { intercept: my, slope: NA };
    var slope = sxy / sxx;
    return { intercept: my - slope * mx, slope: slope };
  }

  // -----------------------------
  // RINGKASAN (padanan summarise_intervals dan summarise_test)
  // -----------------------------
  function summariseIntervals(resp, nIntervals) {
    var out = [];
    for (var i = 1; i <= nIntervals; i++) {
      var rows = resp.filter(function (r) { return r.interval === i; });
      var attempted = rows.length;
      var correct = rows.filter(function (r) { return r.is_correct; }).length;
      var rts = rows.map(function (r) { return r.rt_ms; });
      out.push({
        interval: i,
        attempted: attempted,
        correct: correct,
        wrong: attempted - correct,
        accuracy: roundR(attempted > 0 ? 100 * correct / attempted : NA, 2),
        mean_rt_ms: roundR(attempted > 0 ? mean(rts) : NA, 1),
        median_rt_ms: roundR(attempted > 0 ? median(rts) : NA, 1)
      });
    }
    return out;
  }

  function summariseTest(resp, iv) {
    var attempted = resp.length;
    var correct = resp.filter(function (r) { return r.is_correct; }).length;
    var wrong = attempted - correct;
    var accuracy = attempted > 0 ? 100 * correct / attempted : NA;
    var meanRt = attempted > 0 ? mean(resp.map(function (r) { return r.rt_ms; })) : NA;

    var c = iv.map(function (r) { return r.correct; });
    var x = iv.map(function (r) { return r.interval; });
    var n = c.length;
    var meanCorrect = mean(c);
    var sdCorrect = sd(c);

    // SPEED: rata-rata jawaban benar per interval.
    var speedPerInterval = meanCorrect;
    var speedPerMinute = meanCorrect * (60 / INTERVAL_SECONDS);

    // ENDURANCE: trend linear jumlah benar terhadap interval.
    var fit = linearFit(x, c);
    var slope = fit.slope;
    var predFirst = isNA(slope) ? NA : fit.intercept + slope * 1;
    var predLast = isNA(slope) ? NA : fit.intercept + slope * n;
    var change = isNA(predFirst) ? NA : predLast - predFirst;
    var changePct = (isFinite(predFirst) && predFirst !== null && Math.abs(predFirst) > Number.EPSILON)
      ? 100 * change / predFirst : NA;

    // STABILITY: variasi residual setelah trend dipisahkan.
    var residSd = isNA(slope) ? NA : sd(c.map(function (v, i) { return v - (fit.intercept + slope * x[i]); }));
    var stabilityCv = (!isNA(residSd) && isFinite(meanCorrect) && meanCorrect > Number.EPSILON)
      ? 100 * residSd / meanCorrect : NA;

    var first10 = mean(c.slice(0, Math.min(10, n)));
    var last10 = mean(c.slice(Math.max(0, n - 10)));

    return {
      attempted: attempted,
      correct: correct,
      wrong: wrong,
      accuracy: accuracy,
      mean_rt_ms: meanRt,
      speed_correct_per_interval: speedPerInterval,
      speed_correct_per_minute: speedPerMinute,
      stability_cv: stabilityCv,
      stability_residual_sd: residSd,
      endurance_slope: slope,
      endurance_predicted_change: change,
      endurance_predicted_change_pct: changePct,
      mean_correct_per_interval: meanCorrect,
      sd_correct_per_interval: sdCorrect,
      first10_mean: first10,
      last10_mean: last10,
      change_first_last10: last10 - first10
    };
  }

  // -----------------------------
  // STATE
  // -----------------------------
  var state = {
    page: 'consent',
    participant_id: null,
    timestamp_jakarta: null,
    consent_timestamp_jakarta: null,
    demo: null,

    phase: null,
    phaseStart: null,

    num1: 1,
    num2: 1,
    itemStarted: null,

    responses: [],
    practice_responses: [],
    test_responses: [],

    interval_results: null,
    test_summary: null,
    effort_validation: null,

    saved_ok: false,
    save_error: null,
    saving: false
  };

  function isActivePage() {
    return state.page === 'practice_active' || state.page === 'test_active';
  }

  function getPhaseIntervals() {
    return state.phase === 'practice' ? PRACTICE_INTERVALS : TEST_INTERVALS;
  }

  function setPage(page) {
    state.page = page;
    render();
    window.scrollTo(0, 0);
  }

  function resetStimulus() {
    state.num1 = randInt(1, 9);
    state.num2 = randInt(1, 9);
    state.itemStarted = performance.now();
  }

  function startPhase(phaseName) {
    state.phase = phaseName;
    state.responses = [];
    state.phaseStart = performance.now();
    resetStimulus();
    setPage(phaseName === 'practice' ? 'practice_active' : 'test_active');
  }

  function finishPhase() {
    if (state.phase === 'practice') {
      state.practice_responses = state.responses;
      state.phase = null;
      setPage('practice_done');
    } else if (state.phase === 'test') {
      state.test_responses = state.responses;
      state.interval_results = summariseIntervals(state.test_responses, TEST_INTERVALS);
      state.test_summary = summariseTest(state.test_responses, state.interval_results);
      state.phase = null;
      setPage('validation');
    }
  }

  // Perpindahan interval dihitung dari waktu yang benar-benar berlalu.
  // Batas interval tidak mengubah stimulus; nomor interval ditentukan
  // dari waktu RESPONS saat jawaban diberikan.
  function tick() {
    if (!isActivePage()) return;
    var total = getPhaseIntervals();
    var elapsed = (performance.now() - state.phaseStart) / 1000;
    if (elapsed >= total * INTERVAL_SECONDS) {
      finishPhase();
      return;
    }
    updateProgress();
  }

  function handleDigit(digit) {
    if (!isActivePage()) return;
    if (!(digit >= 0 && digit <= 9) || Math.floor(digit) !== digit) return;

    var now = performance.now();
    var total = getPhaseIntervals();
    var elapsed = (now - state.phaseStart) / 1000;

    // Abaikan respons yang masuk setelah fase berakhir.
    if (elapsed >= total * INTERVAL_SECONDS) return;

    var actualInterval = Math.floor(elapsed / INTERVAL_SECONDS) + 1;
    var correctAnswer = (state.num1 + state.num2) % 10;
    var itemNumber = 1;
    for (var i = 0; i < state.responses.length; i++) {
      if (state.responses[i].interval === actualInterval) itemNumber++;
    }

    state.responses.push({
      interval: actualInterval,
      item: itemNumber,
      num1: state.num1,
      num2: state.num2,
      answer: digit,
      correct_answer: correctAnswer,
      is_correct: digit === correctAnswer,
      rt_ms: now - state.itemStarted
    });

    // Lanjutkan deret angka berdampingan setelah setiap respons.
    state.num1 = state.num2;
    state.num2 = randInt(1, 9);
    state.itemStarted = now;
    updateStimulus();
  }

  // -----------------------------
  // PENYIMPANAN
  // -----------------------------
  function buildPayload() {
    var s = state.test_summary;
    var pr = state.practice_responses;
    var practiceAttempted = pr.length;
    var practiceCorrect = pr.filter(function (r) { return r.is_correct; }).length;
    var practiceAccuracy = practiceAttempted > 0 ? 100 * practiceCorrect / practiceAttempted : NA;

    var participant = {
      participant_id: state.participant_id,
      timestamp_jakarta: state.timestamp_jakarta,
      consent_accepted: true,
      consent_timestamp_jakarta: state.consent_timestamp_jakarta,
      age: state.demo.age,
      gender: state.demo.gender,
      education: state.demo.education,
      province: state.demo.province,
      effort_validation: state.effort_validation,

      practice_attempted: practiceAttempted,
      practice_correct: practiceCorrect,
      practice_accuracy: roundR(practiceAccuracy, 2),

      test_attempted: s.attempted,
      test_correct: s.correct,
      test_wrong: s.wrong,
      test_accuracy: roundR(s.accuracy, 2),

      // Empat indikator utama
      speed_correct_per_interval: roundR(s.speed_correct_per_interval, 3),
      speed_correct_per_minute: roundR(s.speed_correct_per_minute, 3),
      accuracy_percent: roundR(s.accuracy, 3),
      stability_cv_percent: roundR(s.stability_cv, 3),
      stability_residual_sd: roundR(s.stability_residual_sd, 3),
      endurance_slope: roundR(s.endurance_slope, 5),
      endurance_predicted_change: roundR(s.endurance_predicted_change, 3),
      endurance_predicted_change_percent: roundR(s.endurance_predicted_change_pct, 3),

      // Indikator deskriptif pendukung
      mean_correct_per_interval: roundR(s.mean_correct_per_interval, 2),
      sd_correct_per_interval: roundR(s.sd_correct_per_interval, 2),
      mean_rt_ms: roundR(s.mean_rt_ms, 1),

      first10_mean_correct: roundR(s.first10_mean, 2),
      last10_mean_correct: roundR(s.last10_mean, 2),
      change_first_last10: roundR(s.change_first_last10, 2),

      // Rancangan tes yang dipakai saat data ini diambil
      test_intervals: TEST_INTERVALS,
      interval_seconds: INTERVAL_SECONDS,
      app_version: CONFIG.APP_VERSION
    };

    var intervals = state.interval_results.map(function (r) {
      return {
        participant_id: state.participant_id,
        timestamp_jakarta: state.timestamp_jakarta,
        interval: r.interval,
        attempted: r.attempted,
        correct: r.correct,
        wrong: r.wrong,
        accuracy: r.accuracy,
        mean_rt_ms: r.mean_rt_ms,
        median_rt_ms: r.median_rt_ms
      };
    });

    return { participant: participant, intervals: intervals };
  }

  function storePending(payload) {
    try { localStorage.setItem(PENDING_PREFIX + payload.participant.participant_id, JSON.stringify(payload)); } catch (e) {}
  }

  function clearPending(id) {
    try { localStorage.removeItem(PENDING_PREFIX + id); } catch (e) {}
  }

  function postPayload(payload) {
    if (!CONFIG.SAVE_ENDPOINT) {
      return Promise.reject(new Error('Alamat penyimpanan (SAVE_ENDPOINT) belum diisi.'));
    }
    // text/plain menghindari preflight CORS ke Google Apps Script.
    return fetch(CONFIG.SAVE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      redirect: 'follow'
    }).then(function (res) {
      return res.text().then(function (text) {
        var data;
        try { data = JSON.parse(text); } catch (e) {
          throw new Error('Respons server tidak dapat dibaca (HTTP ' + res.status + ').');
        }
        if (!data || !data.ok) throw new Error((data && data.error) || 'Penyimpanan gagal.');
        if (!data.participants_saved || !data.intervals_saved) throw new Error('Penyimpanan belum lengkap.');
        return data;
      });
    });
  }

  function saveToGoogle() {
    if (!state.test_summary || !state.interval_results || state.saving) return;

    state.saving = true;
    state.saved_ok = false;
    state.save_error = null;
    renderSaveBox();

    var payload = buildPayload();
    // Cadangan lokal: bila halaman tertutup sebelum tersimpan, data dikirim
    // ulang otomatis saat aplikasi dibuka lagi di perangkat yang sama.
    storePending(payload);

    postPayload(payload).then(function () {
      clearPending(payload.participant.participant_id);
      state.saved_ok = true;
      state.save_error = null;
    }).catch(function (e) {
      state.saved_ok = false;
      state.save_error = (e && e.message) ? e.message : String(e);
      if (window.console) console.warn('[WorkCurve] Gagal menyimpan:', state.save_error);
    }).then(function () {
      state.saving = false;
      renderSaveBox();
    });
  }

  function flushPending() {
    if (!CONFIG.SAVE_ENDPOINT) return;
    var keys = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(PENDING_PREFIX) === 0) keys.push(k);
      }
    } catch (e) { return; }
    keys.reduce(function (chain, k) {
      return chain.then(function () {
        var payload;
        try { payload = JSON.parse(localStorage.getItem(k)); } catch (e) { return; }
        if (!payload || !payload.participant) return;
        return postPayload(payload).then(function () {
          clearPending(payload.participant.participant_id);
        }).catch(function () {});
      });
    }, Promise.resolve());
  }

  // -----------------------------
  // CSV

  function intervalsCSV(rows) {
    var cols = ['interval', 'attempted', 'correct', 'wrong', 'accuracy', 'mean_rt_ms', 'median_rt_ms'];
    var lines = [cols.map(function (c) { return '"' + c + '"'; }).join(',')];
    rows.forEach(function (r) {
      lines.push(cols.map(function (c) { return isNA(r[c]) ? '' : String(r[c]); }).join(','));
    });
    return lines.join('\n') + '\n';
  }

  function downloadIntervals() {
    if (!state.interval_results) return;
    var blob = new Blob([intervalsCSV(state.interval_results)], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'workcurve_intervals_' + state.participant_id + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // -----------------------------
  // KURVA PERFORMA (padanan plot base R di renderPlot)
  // -----------------------------

  // Padanan GEPretty() yang dipakai axis() di base R.
  function axisTicks(lo, up) {
    var ndiv = 5, h = 0.8, h5 = 1.7, minN = 1;
    var dx = up - lo, cell, iSmall;
    if (dx === 0 && up === 0) { cell = 1; iSmall = true; }
    else {
      cell = Math.max(Math.abs(lo), Math.abs(up));
      var Ub = 1 + ((h5 >= 1.5 * h + 0.5) ? 1 / (1 + h) : 1.5 / (1 + h5));
      Ub *= Math.max(1, ndiv) * Number.EPSILON;
      iSmall = dx < cell * Ub * 3;
    }
    if (iSmall) { if (cell > 10) cell = 9 + cell / 10; cell *= 0.25; }
    else { cell = dx; if (ndiv > 1) cell /= ndiv; }
    var U = Math.pow(10, Math.floor(Math.log10(cell)));
    var unit = U, ns;
    if ((ns = 2 * U) - cell < h * (cell - unit)) {
      unit = ns;
      if ((ns = 5 * U) - cell < h5 * (cell - unit)) {
        unit = ns;
        if ((ns = 10 * U) - cell < h * (cell - unit)) unit = ns;
      }
    }
    var nsI = Math.floor(lo / unit + 1e-7), nuI = Math.ceil(up / unit - 1e-7);
    while (nsI * unit > lo + 1e-10 * unit) nsI--;
    while (nuI * unit < up - 1e-10 * unit) nuI++;
    var ticks = [];
    for (var k = nsI; k <= nuI; k++) {
      var t = Number((k * unit).toFixed(10));
      if (t >= lo - 1e-10 * unit && t <= up + 1e-10 * unit) ticks.push(t);
    }
    return ticks;
  }

  function plotRange(values) {
    var lo = Math.min.apply(null, values), hi = Math.max.apply(null, values);
    if (lo === hi) {
      if (lo === 0) { lo = -1; hi = 1; }
      else { var t = 0.4 * Math.abs(lo); lo -= t; hi += t; }
    }
    var ext = 0.04 * (hi - lo);
    return [lo - ext, hi + ext];
  }

  var textMeasure = null;
  function textWidth(text, font) {
    if (!textMeasure) textMeasure = document.createElement('canvas').getContext('2d');
    textMeasure.font = font;
    return textMeasure.measureText(text).width;
  }

  function drawPlot(container, d) {
    if (!container || !d) return;
    var W = Math.max(280, Math.floor(container.clientWidth || 600));
    var H = 330;
    container.setAttribute('data-width', W);

    var LINE = 14.4; // satu "baris" margin R pada 72 dpi, pointsize 12
    var px0 = 4.5 * LINE, px1 = W - 1 * LINE, py0 = 1.5 * LINE, py1 = H - 4.5 * LINE;

    var xs = d.map(function (r) { return r.interval; });
    var ys = d.map(function (r) { return r.correct; });
    var xu = plotRange(xs), yu = plotRange(ys);

    function sx(v) { return px0 + (v - xu[0]) / (xu[1] - xu[0]) * (px1 - px0); }
    function sy(v) { return py1 - (v - yu[0]) / (yu[1] - yu[0]) * (py1 - py0); }
    function f(v) { return Math.round(v * 100) / 100; }

    var meanC = mean(ys);
    var fit = linearFit(xs, ys);
    var font = '12px Arial, Helvetica, sans-serif';
    var legendFont = '10.2px Arial, Helvetica, sans-serif';

    var xTicks = [1];
    for (var t = 5; t <= TEST_INTERVALS; t += 5) xTicks.push(t);
    var yTicks = axisTicks(yu[0], yu[1]);

    var label = 'Kurva performa: jumlah jawaban benar per interval, ' + d.length + ' interval. ' +
      'Rata-rata ' + fmtNum(meanC, 1) + ' benar per interval; slope trend ' + fmtSigned(fit.slope, 3) + '.';

    var s = [];
    s.push('<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H +
      '" role="img" aria-label="' + esc(label) + '" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000">');
    s.push('<defs><clipPath id="wc-plot-clip"><rect x="' + f(px0) + '" y="' + f(py0) + '" width="' + f(px1 - px0) +
      '" height="' + f(py1 - py0) + '"/></clipPath></defs>');
    s.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#fff"/>');

    // Garis bantu hover
    s.push('<line class="hover-guide" x1="0" x2="0" y1="' + f(py0) + '" y2="' + f(py1) +
      '" stroke="#b8bfcc" stroke-width="1" visibility="hidden"/>');

    // abline rata-rata (lty = 3) dan trend linear (lty = 2, lwd = 2)
    s.push('<g clip-path="url(#wc-plot-clip)">');
    s.push('<line x1="' + f(px0) + '" x2="' + f(px1) + '" y1="' + f(sy(meanC)) + '" y2="' + f(sy(meanC)) +
      '" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/>');
    if (!isNA(fit.slope)) {
      s.push('<line x1="' + f(sx(xu[0])) + '" x2="' + f(sx(xu[1])) +
        '" y1="' + f(sy(fit.intercept + fit.slope * xu[0])) + '" y2="' + f(sy(fit.intercept + fit.slope * xu[1])) +
        '" stroke="#000" stroke-width="2" stroke-dasharray="8 8"/>');
    }
    s.push('</g>');

    // type = "o", pch = 16
    s.push('<polyline fill="none" stroke="#000" stroke-width="1" points="' +
      d.map(function (r) { return f(sx(r.interval)) + ',' + f(sy(r.correct)); }).join(' ') + '"/>');
    d.forEach(function (r) {
      s.push('<circle cx="' + f(sx(r.interval)) + '" cy="' + f(sy(r.correct)) + '" r="4" fill="#000"/>');
    });
    s.push('<circle class="hover-ring" cx="0" cy="0" r="6.5" fill="none" stroke="#3b5ccc" stroke-width="2" visibility="hidden"/>');

    // Kotak plot
    s.push('<rect x="' + f(px0) + '" y="' + f(py0) + '" width="' + f(px1 - px0) + '" height="' + f(py1 - py0) +
      '" fill="none" stroke="#000" stroke-width="1"/>');

    // Sumbu x
    s.push('<line x1="' + f(sx(xTicks[0])) + '" x2="' + f(sx(xTicks[xTicks.length - 1])) + '" y1="' + f(py1) +
      '" y2="' + f(py1) + '" stroke="#000"/>');
    xTicks.forEach(function (v) {
      s.push('<line x1="' + f(sx(v)) + '" x2="' + f(sx(v)) + '" y1="' + f(py1) + '" y2="' + f(py1 + 7.2) + '" stroke="#000"/>');
      s.push('<text x="' + f(sx(v)) + '" y="' + f(py1 + 25) + '" text-anchor="middle">' + v + '</text>');
    });

    // Sumbu y (las = 1)
    if (yTicks.length) {
      s.push('<line x1="' + f(px0) + '" x2="' + f(px0) + '" y1="' + f(sy(yTicks[0])) + '" y2="' +
        f(sy(yTicks[yTicks.length - 1])) + '" stroke="#000"/>');
    }
    yTicks.forEach(function (v) {
      s.push('<line x1="' + f(px0 - 7.2) + '" x2="' + f(px0) + '" y1="' + f(sy(v)) + '" y2="' + f(sy(v)) + '" stroke="#000"/>');
      s.push('<text x="' + f(px0 - 11) + '" y="' + f(sy(v)) + '" dy="0.35em" text-anchor="end">' + v + '</text>');
    });

    // Judul sumbu
    s.push('<text x="' + f((px0 + px1) / 2) + '" y="' + f(py1 + 54) + '" text-anchor="middle">Interval</text>');
    s.push('<text transform="translate(' + f(px0 - 46) + ',' + f((py0 + py1) / 2) + ') rotate(-90)" text-anchor="middle">Jumlah benar</text>');

    // Legenda (topright, bty = "n", cex = 0.85)
    var legendItems = [
      { text: 'Trend linear', dash: '8 8', width: 2 },
      { text: 'Rata-rata', dash: '1 3', width: 1 }
    ];
    var xchar = 0.85 * 0.15 * 72, ychar = 0.85 * 0.2 * 72;
    var maxW = Math.max.apply(null, legendItems.map(function (it) { return textWidth(it.text, legendFont); }));
    var legLeft = px1 - (maxW + 4.5 * xchar);
    legendItems.forEach(function (it, i) {
      var yy = py0 + ychar * (i + 1);
      s.push('<line x1="' + f(legLeft + xchar) + '" x2="' + f(legLeft + 3 * xchar) + '" y1="' + f(yy) + '" y2="' + f(yy) +
        '" stroke="#000" stroke-width="' + it.width + '" stroke-dasharray="' + it.dash + '"/>');
      s.push('<text x="' + f(legLeft + 4 * xchar) + '" y="' + f(yy) + '" dy="0.35em" font-size="10.2">' + esc(it.text) + '</text>');
    });

    // Lapisan hover
    s.push('<rect class="plot-hit" x="' + f(px0) + '" y="' + f(py0) + '" width="' + f(px1 - px0) + '" height="' +
      f(py1 - py0) + '" fill="transparent"/>');
    s.push('</svg>');

    container.innerHTML = s.join('') + '<div class="plot-tip" aria-hidden="true"></div>';

    var svg = container.querySelector('svg');
    var hit = container.querySelector('.plot-hit');
    var guide = container.querySelector('.hover-guide');
    var ring = container.querySelector('.hover-ring');
    var tip = container.querySelector('.plot-tip');

    function show(evt) {
      var rect = svg.getBoundingClientRect();
      var mx = (evt.clientX - rect.left) * (W / rect.width);
      var best = 0, bestD = Infinity;
      for (var i = 0; i < d.length; i++) {
        var dd = Math.abs(sx(d[i].interval) - mx);
        if (dd < bestD) { bestD = dd; best = i; }
      }
      var r = d[best];
      var cx = sx(r.interval), cy = sy(r.correct);
      guide.setAttribute('x1', f(cx)); guide.setAttribute('x2', f(cx));
      guide.setAttribute('visibility', 'visible');
      ring.setAttribute('cx', f(cx)); ring.setAttribute('cy', f(cy));
      ring.setAttribute('visibility', 'visible');
      tip.innerHTML = '<strong>Interval ' + r.interval + '</strong>' +
        '<div class="tip-row">Benar <b>' + r.correct + '</b></div>' +
        '<div class="tip-row">Respons <b>' + r.attempted + '</b></div>' +
        '<div class="tip-row">Accuracy <b>' + (isNA(r.accuracy) ? '–' : fmtNum(r.accuracy, 1) + '%') + '</b></div>';
      tip.style.display = 'block';
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      var left = cx + 14;
      if (left + tw > W - 4) left = cx - 14 - tw;
      var top = Math.max(2, Math.min(cy - th / 2, H - th - 2));
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
    }
    function hide() {
      guide.setAttribute('visibility', 'hidden');
      ring.setAttribute('visibility', 'hidden');
      tip.style.display = 'none';
    }
    hit.addEventListener('pointermove', show);
    hit.addEventListener('pointerdown', show);
    hit.addEventListener('pointerleave', hide);
  }

  // -----------------------------
  // KOMPONEN TAMPILAN
  // -----------------------------
  var IS = INTERVAL_SECONDS;
  var PRACTICE_SECONDS = PRACTICE_INTERVALS * IS;
  var TEST_SECONDS = TEST_INTERVALS * IS;

  function selectOptions(choices, placeholder) {
    return '<option value="">' + esc(placeholder) + '</option>' +
      choices.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');

  function progressHTML() {

      '<div class="progress-stat"><div class="progress-label">Sisa total</div><div class="progress-value" id="pg-total-remaining"></div></div>' +
      '</div>' +

  function stimulusHTML() {
    var keys = '';
    var digits = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0];

      '<div class="stimulus-wrap">' +

      '<div class="stimulus-number bottom" id="num2"></div>' +
      '</div>' +

      '<div class="keyboard-hint">Gunakan tombol angka 0–9 pada keyboard atau keypad di layar.</div>' +
      '</div>';
  }

  function setText(id, value) {
    var el = document.getElementById(id);
    if (el && el.textContent !== value) el.textContent = value;
  }

  function updateProgress() {
    if (!isActivePage()) return;
    var total = getPhaseIntervals();
    var totalSeconds = total * IS;
    var elapsed = Math.max(0, (performance.now() - state.phaseStart) / 1000);
    elapsed = Math.min(elapsed, totalSeconds);

    var intervalNow = Math.min(total, Math.floor(elapsed / IS) + 1);
    var inInterval = elapsed % IS;
    var intervalRemaining = Math.max(0, Math.ceil(IS - inInterval));
    var totalRemaining = Math.max(0, Math.ceil(totalSeconds - elapsed));
    var mm = Math.floor(totalRemaining / 60);
    var ss = totalRemaining % 60;
    var pct = 100 * elapsed / totalSeconds;

    setText('pg-interval', intervalNow + ' / ' + total);
    setText('pg-int-remaining', intervalRemaining + ' dtk');
    setText('pg-total-remaining', p2(mm) + ':' + p2(ss));
    var fill = document.getElementById('pg-fill');
    if (fill) fill.style.width = (Math.round(pct * 100) / 100) + '%';
  }

  function updateStimulus() {
    setText('num1', String(state.num1));
    setText('num2', String(state.num2));
  }

  function metricCard(cls, label, value) {
    return '<div class="' + cls + '"><div class="metric-label">' + esc(label) + '</div><div class="metric-value">' +
      esc(value) + '</div></div>';
  }

  // ---------- Halaman ----------
  function consentPage() {
    return '<div class="panel-card">' +
      '<h2>Persetujuan Mengikuti Tes</h2>' +
      '<p class="lead">Sebelum memulai, silakan membaca informasi berikut dengan saksama.</p>' +
      '<div class="instruction-box">' +
      '<p>' + esc(CONFIG.APP_NAME) + ' merupakan tes performa berbasis penjumlahan sederhana yang digunakan untuk memperoleh gambaran mengenai kecepatan, ketelitian, kestabilan, dan perubahan performa selama pengerjaan.</p>' +
      '<ul>' +
      '<li>Anda akan mengisi data demografi singkat, mengikuti latihan selama ' + formatDuration(PRACTICE_SECONDS) +
      ', kemudian mengerjakan tes utama selama ' + formatDuration(TEST_SECONDS) + '.</li>' +
      '<li>Partisipasi bersifat sukarela. Anda dapat menghentikan pengerjaan kapan saja dengan menutup aplikasi.</li>' +
      '<li>Jawaban dan data demografi akan disimpan untuk keperluan pengembangan, evaluasi, atau penelitian terkait tes ini.</li>' +
      '<li>Data disimpan menggunakan ID peserta dan tidak meminta nama, nomor identitas, alamat, atau informasi kontak.</li>' +
      '<li>Hasil yang ditampilkan bersifat deskriptif dan bukan diagnosis psikologis.</li>' +
      '<li>Pengerjaan dapat menimbulkan kelelahan ringan karena membutuhkan konsentrasi dan kecepatan selama beberapa menit.</li>' +
      '<li>Jika ketentuan penelitian Anda mensyaratkan persetujuan orang tua/wali untuk peserta tertentu, persetujuan tersebut perlu diperoleh sebelum peserta menggunakan aplikasi ini.</li>' +
      '</ul>' +
      '</div>' +
      '<div class="form-group shiny-input-container"><div class="checkbox"><label>' +
      '<input id="consent_agree" type="checkbox"> <span>Saya telah membaca informasi di atas dan bersedia mengikuti tes ini secara sukarela.</span>' +
      '</label></div></div>' +
      '<br>' +
      '<button type="button" class="btn btn-primary" data-action="accept_consent">Saya Setuju dan Lanjutkan</button>' +
      '</div>';
  }

  function demographicsPage() {
    return '<div class="panel-card">' +
      '<h2>Data Peserta</h2>' +
      '<p class="lead">Silakan isi data berikut sebelum memulai tes.</p>' +
      '<div class="row-2">' +
      '<div class="form-group shiny-input-container"><label for="age">Usia</label>' +
      '<input id="age" type="number" class="form-control" min="12" max="100" step="1" inputmode="numeric"></div>' +
      '<div class="form-group shiny-input-container"><label for="gender">Jenis kelamin</label>' +
      '<select id="gender" class="form-control">' + selectOptions(['Laki-laki', 'Perempuan', 'Tidak ingin menjawab'], 'Pilih') + '</select></div>' +
      '</div>' +
      '<div class="row-2">' +
      '<div class="form-group shiny-input-container"><label for="education">Pendidikan terakhir / sedang ditempuh</label>' +
      '<select id="education" class="form-control">' +
      selectOptions(['SMP/sederajat', 'SMA/SMK/sederajat', 'Diploma', 'S1', 'S2', 'S3', 'Lainnya'], 'Pilih') + '</select></div>' +
      '<div class="form-group shiny-input-container"><label for="province">Asal provinsi</label>' +
      '<select id="province" class="form-control">' + selectOptions(PROVINCES, 'Pilih provinsi') + '</select></div>' +
      '</div>' +
      '<br>' +
      '<button type="button" class="btn btn-primary" data-action="submit_demographics">Lanjut ke latihan</button>' +
      '</div>';
  }

  function practiceInfoPage() {
    return '<div class="panel-card">' +
      '<h2>Petunjuk Latihan</h2>' +
      '<p class="lead">Pada layar akan muncul dua angka. Jumlahkan kedua angka tersebut, lalu masukkan HANYA ANGKA SATUANNYA dari hasil penjumlahan.</p>' +
      '<div class="example-box">7 + 8 = 15 &nbsp;&rarr;&nbsp; tekan <strong>5</strong></div>' +
      '<div class="instruction-box"><ul>' +
      '<li>Jawab secepat dan seteliti mungkin.</li>' +
      '<li><strong>Selalu masukkan hanya angka satuannya.</strong></li>' +
      '<li>Contoh: 7 + 8 = 15, maka jawaban yang dimasukkan adalah 5, bukan 15.</li>' +
      '<li>Soal berikutnya muncul otomatis setelah Anda menjawab.</li>' +
      '<li>Sistem berpindah interval otomatis setiap ' + IS + ' detik. Pergantian interval TIDAK mengganti angka yang sedang tampil. Pasangan angka tetap di layar sampai Anda menjawab, kemudian respons tersebut dihitung pada interval sesuai waktu jawaban.</li>' +
      '<li>Latihan terdiri dari ' + PRACTICE_INTERVALS + ' interval atau ' + PRACTICE_SECONDS + ' detik.</li>' +
      '</ul></div>' +
      '<button type="button" class="btn btn-primary" data-action="start_practice">Mulai latihan</button>' +
      '</div>';
  }

  function activePage(title) {
    return '<div class="panel-card">' +
      '<h2>' + esc(title) + '</h2>' +
      progressHTML() +
      stimulusHTML() +
      '</div>';
  }

  function practiceDonePage() {
    var pr = state.practice_responses;
    var attempted = pr.length;
    var correct = pr.filter(function (r) { return r.is_correct; }).length;
    var accuracy = attempted > 0 ? 100 * correct / attempted : NA;
    return '<div class="panel-card">' +
      '<h2>Latihan Selesai</h2>' +
      '<p class="lead">Tes utama akan berlangsung tanpa jeda selama ' + TEST_INTERVALS + ' interval. Pastikan Anda siap sebelum menekan tombol mulai.</p>' +
      '<div class="metric-grid">' +
      metricCard('metric-card', 'Respons latihan', String(attempted)) +
      metricCard('metric-card', 'Benar', String(correct)) +
      metricCard('metric-card', 'Accuracy', isNA(accuracy) ? '–' : fmtNum(accuracy, 1) + '%') +
      '</div>' +
      '<div class="instruction-box"><strong>Tes utama: </strong>' + TEST_INTERVALS + ' interval × ' + IS + ' detik = ' +
      formatDuration(TEST_SECONDS) + '.</div>' +
      '<button type="button" class="btn btn-primary" data-action="start_test">Mulai tes utama</button>' +
      '</div>';
  }

  function validationPage() {
    return '<div class="panel-card">' +
      '<h2>Konfirmasi Pengerjaan</h2>' +
      '<p class="lead">Sebelum melihat hasil, mohon jawab pertanyaan berikut dengan jujur.</p>' +
      '<div class="instruction-box"><strong>Apakah Anda mengerjakan tes ini dengan sungguh-sungguh sesuai kemampuan Anda?</strong></div>' +
      '<div class="form-group shiny-input-container" role="radiogroup">' +
      '<div class="radio"><label><input type="radio" name="effort_validation" value="Ya"> <span>Ya, saya mengerjakan dengan sungguh-sungguh</span></label></div>' +
      '<div class="radio"><label><input type="radio" name="effort_validation" value="Tidak"> <span>Tidak, saya merasa tidak mengerjakan dengan sungguh-sungguh</span></label></div>' +
      '</div>' +
      '<br>' +
      '<button type="button" class="btn btn-primary" data-action="submit_validation">Lihat hasil</button>' +
      '</div>';
  }

  function saveBoxHTML() {
    if (state.saving) {
      return '<div class="instruction-box">Menyimpan hasil...</div>';
    }
    if (state.saved_ok) {
      return '<div class="save-ok">Hasil telah tersimpan.</div>';
    }
    return '<div class="save-error">' +
      '<p style="margin-bottom:8px;"><strong>Hasil belum tersimpan.</strong></p>' +
      (state.save_error
        ? '<details style="margin-bottom:12px;"><summary>Lihat detail error</summary>' +
          '<pre style="white-space:pre-wrap; margin-top:8px; font-size:12px;">' + esc(state.save_error) + '</pre></details>'
        : '') +
      '<button type="button" class="btn btn-default" data-action="retry_save">Coba simpan kembali</button>' +
      '</div>';
  }

  function renderSaveBox() {
    var el = document.getElementById('save-box');
    if (el) el.innerHTML = saveBoxHTML();
  }

  function intervalTableHTML(d) {
    var head = '<tr><th>Interval</th><th>Respons</th><th>Benar</th><th>Salah</th><th>Accuracy (%)</th><th>Mean RT (ms)</th><th>Median RT (ms)</th></tr>';
    var body = d.map(function (r) {
      return '<tr><td>' + r.interval + '</td><td>' + r.attempted + '</td><td>' + r.correct + '</td><td>' + r.wrong +
        '</td><td>' + fmtNum(r.accuracy) + '</td><td>' + fmtNum(r.mean_rt_ms) + '</td><td>' + fmtNum(r.median_rt_ms) + '</td></tr>';
    }).join('');
    return '<details class="table-view"><summary>Lihat tabel per interval</summary>' +
      '<div class="table-scroll"><table class="interval-table"><thead>' + head + '</thead><tbody>' + body +
      '</tbody></table></div></details>';
  }

  function resultsPage() {
    var s = state.test_summary;
    var accuracyTxt = isNA(s.accuracy) ? '–' : fmtNum(s.accuracy, 1) + '%';
    var meanRtTxt = isNA(s.mean_rt_ms) ? '–' : fmtNum(s.mean_rt_ms / 1000, 2) + ' dtk';
    var stabilityTxt = isNA(s.stability_cv) ? '–' : fmtNum(s.stability_cv, 1) + '%';
    var changePctTxt = isNA(s.endurance_predicted_change_pct) ? '–' : fmtSigned(s.endurance_predicted_change_pct, 1) + '%';

    var effortNote = state.effort_validation === 'Tidak'
      ? '<div class="save-error"><strong>Catatan validitas respons: </strong>Anda menyatakan tidak mengerjakan tes dengan sungguh-sungguh. Hasil ini sebaiknya tidak digunakan untuk interpretasi individual.</div>'
      : '';

    var downloadIcon = '<svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M7 1h2v7.6l2.3-2.3 1.4 1.4L8 12.4 3.3 7.7l1.4-1.4L7 8.6V1zM2 13h12v2H2z"/></svg>';

    return '<div class="panel-card">' +
      '<h2>Hasil Tes</h2>' +
      '<p class="lead">ID peserta: ' + esc(state.participant_id) + '</p>' +

      '<h3>Ringkasan Hasil</h3>' +
      '<p class="small-note">Ringkasan berikut menunjukkan performa umum selama pengerjaan tes.</p>' +
      '<div class="basic-metric-grid">' +
      metricCard('basic-metric-card', 'Total respons', String(s.attempted)) +
      metricCard('basic-metric-card', 'Jawaban benar', String(s.correct)) +
      metricCard('basic-metric-card', 'Mean response time', meanRtTxt) +
      metricCard('basic-metric-card', 'Rerata 10 interval awal', fmtNum(s.first10_mean, 1)) +
      metricCard('basic-metric-card', 'Rerata 10 interval akhir', fmtNum(s.last10_mean, 1)) +
      '</div>' +

      '<div class="profile-section">' +
      '<div class="profile-section-title">Profil Performa</div>' +
      '<div class="profile-section-note">Empat indikator utama berikut menggambarkan pola performa selama tes. Nilai masih bersifat deskriptif dan belum menggunakan kategori normatif.</div>' +
      '<div class="profile-grid">' +
      '<div class="profile-card"><div class="metric-label">Speed</div><div class="metric-value">' + fmtNum(s.speed_correct_per_interval, 1) +
      '</div><div class="small-note">jawaban benar / ' + IS + ' detik</div></div>' +
      '<div class="profile-card"><div class="metric-label">Accuracy</div><div class="metric-value">' + accuracyTxt +
      '</div><div class="small-note">proporsi respons yang benar</div></div>' +
      '<div class="profile-card"><div class="metric-label">Stability</div><div class="metric-value">' + stabilityTxt +
      '</div><div class="small-note">lebih kecil = lebih stabil</div></div>' +
      '<div class="profile-card"><div class="metric-label">Endurance</div><div class="metric-value">' + fmtSigned(s.endurance_slope, 3) +
      '</div><div class="small-note">slope performa per interval</div></div>' +
      '</div>' +
      '</div>' +

      '<div class="instruction-box">' +
      '<strong>Cara membaca empat indikator utama</strong>' +
      '<ul>' +
      '<li><strong>Speed:</strong> rata-rata ' + fmtNum(s.speed_correct_per_interval, 1) + ' jawaban benar pada setiap interval ' + IS + ' detik.</li>' +
      '<li><strong>Accuracy:</strong> ' + (isNA(s.accuracy) ? '–' : fmtNum(s.accuracy, 1) + '%') + ' dari seluruh respons dijawab benar.</li>' +
      '<li><strong>Stability:</strong> indeks fluktuasi sebesar ' + stabilityTxt + '. Nilai yang lebih kecil menunjukkan performa yang lebih konsisten setelah trend umum dipisahkan.</li>' +
      '<li><strong>Endurance:</strong> slope ' + fmtSigned(s.endurance_slope, 3) + ' jawaban benar per interval. Perubahan trend terprediksi dari awal hingga akhir adalah ' + changePctTxt + '.</li>' +
      '</ul>' +
      '</div>' +

      '<h3>Kurva Performa</h3>' +
      '<p class="small-note">Titik menunjukkan jumlah jawaban benar pada setiap interval ' + IS + ' detik. Garis trend linear digunakan sebagai indikator Endurance, sedangkan fluktuasi di sekitar trend digunakan dalam indikator Stability.</p>' +
      '<div class="plot-wrap" id="result_plot"></div>' +
      intervalTableHTML(state.interval_results) +

      effortNote +

      '<p class="small-note">Speed, Accuracy, Stability, dan Endurance pada halaman ini merupakan indikator performa behavioral. Interpretasi psikologis dan kategori normatif memerlukan bukti reliabilitas, validitas, serta norma yang sesuai dengan tujuan penggunaan.</p>' +

      '<div id="save-box">' + saveBoxHTML() + '</div>' +

      '<button type="button" class="btn btn-default" data-action="download_intervals">' + downloadIcon + 'Download data interval (.csv)</button>' +
      '</div>';
  }

  function errorPage() {
    return '<div class="panel-card"><h2>Terjadi kesalahan</h2><p>Halaman tidak dapat ditampilkan.</p></div>';
  }

  // -----------------------------
  // RENDER
  // -----------------------------
  function render() {
    var root = document.getElementById('page');
    var p = state.page;
    var html;
    if (p === 'consent') html = consentPage();
    else if (p === 'demographics') html = demographicsPage();
    else if (p === 'practice_info') html = practiceInfoPage();
    else if (p === 'practice_active') html = activePage('Latihan');
    else if (p === 'practice_done') html = practiceDonePage();
    else if (p === 'test_active') html = activePage('Tes Utama');
    else if (p === 'validation') html = validationPage();
    else if (p === 'results' && state.test_summary) html = resultsPage();
    else html = errorPage();
    root.innerHTML = html;

    if (isActivePage()) {
      updateProgress();
      updateStimulus();
    }
    if (p === 'results') {
      drawPlot(document.getElementById('result_plot'), state.interval_results);
    }
  }

  // -----------------------------
  // AKSI
  // -----------------------------
  var actions = {
    accept_consent: function () {
      var box = document.getElementById('consent_agree');
      if (!box || !box.checked) {
        showNotification('Anda perlu menyatakan persetujuan sebelum melanjutkan.', 'warning');
        return;
      }
      state.consent_timestamp_jakarta = jakartaTime();
      setPage('demographics');
    },

    submit_demographics: function () {
      var ageEl = document.getElementById('age');
      var age = ageEl ? ageEl.valueAsNumber : NaN;
      if (isNaN(age) && ageEl && ageEl.value !== '') age = Number(String(ageEl.value).replace(',', '.'));
      var gender = document.getElementById('gender').value;
      var education = document.getElementById('education').value;
      var province = document.getElementById('province').value;

      if (isNaN(age) || !gender || !education || !province) {
        showNotification('Lengkapi seluruh data peserta terlebih dahulu.', 'warning');
        return;
      }
      if (age < 12 || age > 100) {
        showNotification('Periksa kembali usia yang diisikan.', 'error');
        return;
      }

      state.participant_id = newParticipantId();
      state.timestamp_jakarta = jakartaTime();
      state.demo = {
        age: Math.trunc(age),
        gender: gender,
        education: education,
        province: province
      };
      setPage('practice_info');
    },

    start_practice: function () { startPhase('practice'); },
    start_test: function () { startPhase('test'); },

    submit_validation: function () {
      var picked = document.querySelector('input[name="effort_validation"]:checked');
      if (!picked) {
        showNotification('Pilih salah satu jawaban terlebih dahulu.', 'warning');
        return;
      }
      state.effort_validation = picked.value;
      setPage('results');
      saveToGoogle();
    },

    retry_save: function () { if (!state.saving) saveToGoogle(); },
    download_intervals: downloadIntervals
  };

  document.addEventListener('click', function (e) {
    var key = e.target.closest ? e.target.closest('.keypad-btn') : null;
    if (key) {
      handleDigit(Number(key.getAttribute('data-digit')));
      return;
    }
    var btn = e.target.closest ? e.target.closest('[data-action]') : null;
    if (btn && actions[btn.getAttribute('data-action')]) {
      actions[btn.getAttribute('data-action')]();
    }
  });

  // Mencegah tombol keypad menerima fokus, agar Spasi/Enter tidak
  // mengirim ulang angka terakhir.
  document.addEventListener('mousedown', function (e) {
    if (e.target.closest && e.target.closest('.keypad-btn')) e.preventDefault();
  });

  document.addEventListener('keydown', function (e) {
    var tag = ((e.target && e.target.tagName) || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || tag === 'select';
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)) {
      e.preventDefault();
      if (e.repeat) return;
      handleDigit(Number(e.key));
    }
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (state.page !== 'results') return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var el = document.getElementById('result_plot');
      if (el && Number(el.getAttribute('data-width')) !== Math.max(280, Math.floor(el.clientWidth))) {
        drawPlot(el, state.interval_results);
      }
    }, 150);
  });

  document.addEventListener('visibilitychange', tick);
  setInterval(tick, 100);

  // -----------------------------
  // MULAI
  // -----------------------------
  document.title = CONFIG.APP_NAME;
  document.getElementById('brand-title').textContent = CONFIG.APP_NAME;
  render();
  flushPending();

  // Fungsi murni untuk pengujian (tidak memengaruhi jalannya tes).
  window.NPTLib = {
    roundR: roundR,
    fmtSigned: fmtSigned,
    axisTicks: axisTicks,
    summariseIntervals: summariseIntervals,
    summariseTest: summariseTest
  };
})();
</script>
</body>
</html>
